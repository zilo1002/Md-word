<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 转 Word 工具</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-gradient-start: #0a0e27;
    --bg-gradient-end: #1a1a40;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
    min-height: 100vh;
    padding: 40px 20px;
    transition: background 0.5s ease;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 40px;
    text-align: center;
    position: relative;
  }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
  .header p { font-size: 15px; opacity: 0.8; }
  .theme-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
  }
  .theme-btn:hover { background: rgba(255,255,255,0.25); }
  .content { padding: 30px; }
  .upload-area {
    border: 3px dashed #c5c5c5;
    border-radius: 16px;
    padding: 50px 30px;
    text-align: center;
    background: #fafbfc;
    transition: all 0.3s ease;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #667eea;
    background: #f0f4ff;
    transform: translateY(-2px);
  }
  .upload-area input { display: none; }
  .upload-icon { font-size: 56px; margin-bottom: 16px; }
  .upload-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px; }
  .upload-desc { font-size: 14px; color: #888; }
  .file-card {
    background: #e8f5e9;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    border: 1px solid #c8e6c9;
  }
  .file-info { display: flex; align-items: center; gap: 12px; }
  .file-icon { font-size: 28px; }
  .file-name { font-weight: 600; color: #2e7d32; font-size: 15px; }
  .file-size { color: #66bb6a; font-size: 13px; }
  .btn-remove {
    background: #ef5350;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-remove:hover { background: #d32f2f; }
  .btn-convert {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 24px;
  }
  .btn-convert:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
  .btn-convert:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .result-area { display: none; }
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-item {
    flex: 1;
    min-width: 140px;
    background: #f8f9fa;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    border: 1px solid #e9ecef;
  }
  .stat-num { font-size: 28px; font-weight: 700; color: #667eea; }
  .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 2px solid #e9ecef;
  }
  .tab {
    padding: 10px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    color: #666;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
  }
  .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .preview-box {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid #e9ecef;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #333;
  }
  .table-preview-wrap {
    overflow-x: auto;
    margin-bottom: 20px;
  }
  .table-preview-wrap table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .table-preview-wrap th, .table-preview-wrap td {
    border: 1px solid #ddd;
    padding: 10px 14px;
    text-align: left;
  }
  .table-preview-wrap th {
    background: #667eea;
    color: #fff;
    font-weight: 600;
  }
  .table-preview-wrap tr:nth-child(even) { background: #f8f9fa; }
  .table-item { margin-bottom: 24px; }
  .table-item-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: #e3f2fd;
    border-radius: 8px;
    display: inline-block;
  }
  .btn-download {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    text-align: center;
  }
  .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,184,148,0.4); }
  .empty-state {
    text-align: center;
    padding: 40px;
    color: #999;
    font-size: 14px;
  }
  .progress-wrap {
    margin-bottom: 20px;
    display: none;
  }
  .progress-bar {
    height: 6px;
    background: #e9ecef;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    width: 0%;
    transition: width 0.3s;
    border-radius: 3px;
  }
  .progress-text {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 8px;
  }
  /* 主题弹窗 */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    width: 90%;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal h3 { font-size: 18px; margin-bottom: 20px; color: #333; }
  .color-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .color-row label { font-size: 14px; color: #555; min-width: 70px; }
  .color-row input[type="color"] {
    width: 50px; height: 40px;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    padding: 2px;
  }
  .color-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    font-family: monospace;
  }
  .color-row input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
  }
  .preset-colors {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .preset-color {
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
  }
  .preset-color:hover { transform: scale(1.15); }
  .preset-color.active { border-color: #333; }
  .modal-btns {
    display: flex;
    gap: 10px;
  }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save { background: #667eea; color: #fff; }
  .btn-save:hover { background: #5a6fd6; }
  .btn-reset { background: #f0f0f0; color: #555; }
  .btn-reset:hover { background: #e0e0e0; }
  .preview-strip {
    height: 40px;
    border-radius: 8px;
    margin-bottom: 16px;
    transition: background 0.3s;
    border: 1px solid #e0e0e0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="theme-btn" id="themeBtn">🎨 换背景</button>
    <h1>📄 Markdown 转 Word 工具</h1>
    <p>上传 Markdown 文件，完整转换为 Word 文档，表格自动识别并保留</p>
  </div>
  <div class="content">
    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept=".md,.markdown,.txt">
      <div class="upload-icon">📁</div>
      <div class="upload-title">点击上传或拖拽 Markdown 文件到此处</div>
      <div class="upload-desc">支持 .md、.markdown、.txt 格式</div>
    </div>

    <div id="fileCard" style="display:none;">
      <div class="file-card">
        <div class="file-info">
          <span class="file-icon">📄</span>
          <div>
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
          </div>
        </div>
        <button class="btn-remove" id="btnRemove">移除</button>
      </div>
      <button class="btn-convert" id="btnConvert">🔧 开始转换</button>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">正在解析文档...</div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="stats-bar" id="statsBar"></div>
      <div class="tabs">
        <button class="tab active" data-tab="tables">📊 识别到的表格</button>
        <button class="tab" data-tab="preview">📝 文档预览</button>
      </div>
      <div class="tab-content active" id="tabTables"></div>
      <div class="tab-content" id="tabPreview">
        <div class="preview-box" id="docPreview"></div>
      </div>
      <div style="margin-top: 24px;">
        <button class="btn-download" id="btnDownload">⬇️ 下载 Word 文档 (.docx)</button>
      </div>
    </div>
  </div>
</div>

<!-- 主题设置弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>🎨 自定义背景颜色</h3>
    <div class="preview-strip" id="previewStrip"></div>
    <div class="preset-colors" id="presetColors"></div>
    <div class="color-row">
      <label>起始色</label>
      <input type="color" id="colorStart" value="#0a0e27">
      <input type="text" id="textStart" value="#0a0e27" placeholder="#0a0e27">
    </div>
    <div class="color-row">
      <label>结束色</label>
      <input type="color" id="colorEnd" value="#1a1a40">
      <input type="text" id="textEnd" value="#1a1a40" placeholder="#1a1a40">
    </div>
    <div class="modal-btns">
      <button class="btn-reset" id="btnReset">恢复默认</button>
      <button class="btn-save" id="btnSave">保存设置</button>
    </div>
  </div>
</div>

<script>
let mdContent = "";
let docBlob = null;
let tableCount = 0;

const uploadArea = document.getElementById("uploadArea");
const fileInput = document.getElementById("fileInput");
const fileCard = document.getElementById("fileCard");
const btnRemove = document.getElementById("btnRemove");
const btnConvert = document.getElementById("btnConvert");
const resultArea = document.getElementById("resultArea");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

// ========== 主题系统 ==========
const DEFAULT_START = "#0a0e27";
const DEFAULT_END = "#1a1a40";
const PRESETS = [
  { start: "#0a0e27", end: "#1a1a40", name: "深蓝" },
  { start: "#1a1a2e", end: "#16213e", name: "暗蓝" },
  { start: "#0f2027", end: "#203a43", name: "墨绿" },
  { start: "#2c3e50", end: "#4ca1af", name: "青灰" },
  { start: "#200122", end: "#6f0000", name: "暗红" },
  { start: "#1e3c72", end: "#2a5298", name: "海蓝" },
  { start: "#141e30", end: "#243b55", name: "夜空" },
  { start: "#000000", end: "#434343", name: "黑白" },
  { start: "#3a1c71", end: "#d76d77", name: "紫粉" },
  { start: "#11998e", end: "#38ef7d", name: "翠绿" },
  { start: "#8e2de2", end: "#4a00e0", name: "紫电" },
  { start: "#ff512f", end: "#dd2476", name: "日落" },
];

function loadTheme() {
  const saved = localStorage.getItem("md2word-theme");
  if (saved) {
    try {
      const t = JSON.parse(saved);
      applyTheme(t.start, t.end);
    } catch(e) {}
  }
}

function applyTheme(start, end) {
  document.documentElement.style.setProperty("--bg-gradient-start", start);
  document.documentElement.style.setProperty("--bg-gradient-end", end);
}

function saveTheme(start, end) {
  localStorage.setItem("md2word-theme", JSON.stringify({ start, end }));
}

function initThemeUI() {
  const container = document.getElementById("presetColors");
  const saved = localStorage.getItem("md2word-theme");
  let current = saved ? JSON.parse(saved) : { start: DEFAULT_START, end: DEFAULT_END };
  
  container.innerHTML = PRESETS.map(p => {
    const isActive = p.start === current.start && p.end === current.end;
    return `<div class="preset-color ${isActive ? "active" : ""}" 
      style="background: linear-gradient(135deg, ${p.start}, ${p.end})" 
      data-start="${p.start}" data-end="${p.end}" title="${p.name}"></div>`;
  }).join("");
  
  document.querySelectorAll(".preset-color").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.dataset.start, e = el.dataset.end;
      document.getElementById("colorStart").value = s;
      document.getElementById("textStart").value = s;
      document.getElementById("colorEnd").value = e;
      document.getElementById("textEnd").value = e;
      updatePreview(s, e);
      document.querySelectorAll(".preset-color").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
    });
  });
}

function updatePreview(start, end) {
  document.getElementById("previewStrip").style.background = `linear-gradient(135deg, ${start}, ${end})`;
}

// 弹窗控制
document.getElementById("themeBtn").addEventListener("click", () => {
  const saved = localStorage.getItem("md2word-theme");
  let current = saved ? JSON.parse(saved) : { start: DEFAULT_START, end: DEFAULT_END };
  document.getElementById("colorStart").value = current.start;
  document.getElementById("textStart").value = current.start;
  document.getElementById("colorEnd").value = current.end;
  document.getElementById("textEnd").value = current.end;
  updatePreview(current.start, current.end);
  initThemeUI();
  document.getElementById("modalOverlay").classList.add("show");
});

document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modalOverlay")) {
    document.getElementById("modalOverlay").classList.remove("show");
  }
});

// 颜色输入同步
["Start", "End"].forEach(side => {
  const colorInput = document.getElementById("color" + side);
  const textInput = document.getElementById("text" + side);
  
  colorInput.addEventListener("input", () => {
    textInput.value = colorInput.value;
    updatePreview(
      document.getElementById("colorStart").value,
      document.getElementById("colorEnd").value
    );
    document.querySelectorAll(".preset-color").forEach(c => c.classList.remove("active"));
  });
  
  textInput.addEventListener("input", () => {
    const val = textInput.value;
    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
      colorInput.value = val;
      updatePreview(
        document.getElementById("colorStart").value,
        document.getElementById("colorEnd").value
      );
      document.querySelectorAll(".preset-color").forEach(c => c.classList.remove("active"));
    }
  });
});

document.getElementById("btnSave").addEventListener("click", () => {
  const s = document.getElementById("colorStart").value;
  const e = document.getElementById("colorEnd").value;
  applyTheme(s, e);
  saveTheme(s, e);
  document.getElementById("modalOverlay").classList.remove("show");
});

document.getElementById("btnReset").addEventListener("click", () => {
  document.getElementById("colorStart").value = DEFAULT_START;
  document.getElementById("textStart").value = DEFAULT_START;
  document.getElementById("colorEnd").value = DEFAULT_END;
  document.getElementById("textEnd").value = DEFAULT_END;
  updatePreview(DEFAULT_START, DEFAULT_END);
  applyTheme(DEFAULT_START, DEFAULT_END);
  saveTheme(DEFAULT_START, DEFAULT_END);
  initThemeUI();
});

// 初始化主题
loadTheme();

// ========== 文件上传 ==========
uploadArea.addEventListener("click", () => fileInput.click());
uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("dragover"); });
uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    mdContent = e.target.result;
    document.getElementById("fileName").textContent = file.name;
    document.getElementById("fileSize").textContent = (file.size / 1024).toFixed(1) + " KB";
    uploadArea.style.display = "none";
    fileCard.style.display = "block";
    resultArea.style.display = "none";
  };
  reader.readAsText(file);
}

btnRemove.addEventListener("click", () => {
  mdContent = "";
  fileInput.value = "";
  uploadArea.style.display = "block";
  fileCard.style.display = "none";
  resultArea.style.display = "none";
});

function setProgress(pct, text) {
  progressWrap.style.display = "block";
  progressFill.style.width = pct + "%";
  progressText.textContent = text;
}

function hideProgress() {
  setTimeout(() => { progressWrap.style.display = "none"; }, 500);
}

function parseMarkdown(text) {
  const tokens = marked.lexer(text);
  const tables = [];
  function findTables(tokList) {
    for (const t of tokList) {
      if (t.type === "table") {
        tables.push({
          header: t.header.map(h => h.text),
          align: t.align,
          rows: t.rows.map(r => r.map(c => c.text))
        });
      }
      if (t.tokens) findTables(t.tokens);
    }
  }
  findTables(tokens);
  return { tokens, tables };
}

async function generateDocx() {
  setProgress(10, "正在解析 Markdown...");
  const { tokens, tables } = parseMarkdown(mdContent);
  tableCount = tables.length;
  
  setProgress(30, "正在构建文档结构...");
  const children = [];
  
  for (const token of tokens) {
    const nodes = await tokenToDocx(token);
    if (Array.isArray(nodes)) children.push(...nodes);
    else if (nodes) children.push(nodes);
  }
  
  setProgress(70, "正在生成 Word 文件...");
  
  const doc = new docx.Document({
    styles: {
      paragraphStyles: [
        { id: "Normal", name: "Normal", run: { font: { name: "Calibri" }, size: 22 } },
        { id: "Heading1", name: "Heading 1", run: { font: { name: "Calibri" }, size: 36, bold: true, color: "1a1a2e" }, paragraph: { spacing: { after: 200 } } },
        { id: "Heading2", name: "Heading 2", run: { font: { name: "Calibri" }, size: 28, bold: true, color: "16213e" }, paragraph: { spacing: { after: 160 } } },
        { id: "Heading3", name: "Heading 3", run: { font: { name: "Calibri" }, size: 24, bold: true, color: "333333" }, paragraph: { spacing: { after: 120 } } },
        { id: "Heading4", name: "Heading 4", run: { font: { name: "Calibri" }, size: 22, bold: true, color: "444444" }, paragraph: { spacing: { after: 100 } } },
        { id: "Heading5", name: "Heading 5", run: { font: { name: "Calibri" }, size: 22, bold: true, color: "555555" }, paragraph: { spacing: { after: 80 } } },
        { id: "Heading6", name: "Heading 6", run: { font: { name: "Calibri" }, size: 22, bold: true, color: "666666" }, paragraph: { spacing: { after: 80 } } },
        { id: "CodeBlock", name: "Code Block", run: { font: { name: "Consolas" }, size: 18, color: "333333" }, paragraph: { spacing: { before: 80, after: 80 } } },
      ]
    },
    sections: [{
      properties: {
        page: { margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } }
      },
      children: children
    }]
  });
  
  setProgress(90, "正在打包...");
  docBlob = await docx.Packer.toBlob(doc);
  setProgress(100, "完成！");
  hideProgress();
}

async function tokenToDocx(token) {
  switch (token.type) {
    case "heading": {
      const level = Math.min(token.depth, 6);
      return new docx.Paragraph({
        text: token.text,
        heading: docx.HeadingLevel["HEADING_" + level],
        spacing: { after: 200 }
      });
    }
    
    case "paragraph": {
      const runs = inlineToRuns(token.tokens || []);
      return new docx.Paragraph({ children: runs, spacing: { after: 120 } });
    }
    
    case "table": {
      const rows = [];
      const headerCells = token.header.map((h, i) => new docx.TableCell({
        children: [new docx.Paragraph({
          children: inlineToRuns(h.tokens || []),
          alignment: alignToDocx(token.align[i]),
          spacing: { before: 60, after: 60 }
        })],
        shading: { fill: "4472C4", type: docx.ShadingType.CLEAR },
        verticalAlign: docx.VerticalAlign.CENTER,
        borders: tableCellBorders()
      }));
      rows.push(new docx.TableRow({ children: headerCells, tableHeader: true }));
      
      for (const row of token.rows) {
        const cells = row.map((c, i) => new docx.TableCell({
          children: [new docx.Paragraph({
            children: inlineToRuns(c.tokens || []),
            alignment: alignToDocx(token.align[i]),
            spacing: { before: 40, after: 40 }
          })],
          verticalAlign: docx.VerticalAlign.CENTER,
          borders: tableCellBorders()
        }));
        rows.push(new docx.TableRow({ children: cells }));
      }
      
      return new docx.Table({
        rows: rows,
        width: { size: 100, type: docx.WidthType.PERCENTAGE },
        borders: {
          top: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
          bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
          left: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
          right: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
          insideHorizontal: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
          insideVertical: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
        }
      });
    }
    
    case "code": {
      const lines = token.text.split("\\n");
      return lines.map(line => new docx.Paragraph({
        children: [new docx.TextRun({ text: line || " ", font: { name: "Consolas" }, size: 18, color: "333333" })],
        shading: { fill: "F5F5F5" },
        spacing: { before: 20, after: 20, line: 276 },
        style: "CodeBlock"
      }));
    }
    
    case "blockquote": {
      const quoteParagraphs = [];
      for (const t of token.tokens || []) {
        const nodes = await tokenToDocx(t);
        if (Array.isArray(nodes)) {
          for (const n of nodes) {
            if (n instanceof docx.Paragraph) {
              n.properties = n.properties || {};
              n.properties.indent = { left: 720 };
              n.properties.shading = { fill: "F8F9FA" };
              quoteParagraphs.push(n);
            }
          }
        }
      }
      return quoteParagraphs;
    }
    
    case "list": {
      return (token.items || []).map(item => new docx.Paragraph({
        children: inlineToRuns(item.tokens || []),
        bullet: { level: 0 },
        spacing: { after: 60 }
      }));
    }
    
    case "hr": {
      return new docx.Paragraph({
        border: { bottom: { color: "CCCCCC", space: 1, style: docx.BorderStyle.SINGLE, size: 6 } },
        spacing: { before: 200, after: 200 }
      });
    }
    
    case "space":
      return null;
      
    default:
      return null;
  }
}

function inlineToRuns(tokens) {
  const runs = [];
  for (const t of tokens || []) {
    switch (t.type) {
      case "text":
        runs.push(new docx.TextRun({ text: t.text, font: { name: "Calibri" }, size: 22 }));
        break;
      case "strong":
        runs.push(new docx.TextRun({ text: t.text, bold: true, font: { name: "Calibri" }, size: 22 }));
        break;
      case "em":
        runs.push(new docx.TextRun({ text: t.text, italics: true, font: { name: "Calibri" }, size: 22 }));
        break;
      case "codespan":
        runs.push(new docx.TextRun({
          text: t.text,
          font: { name: "Consolas" },
          size: 20,
          shading: { fill: "F0F0F0" }
        }));
        break;
      case "del":
        runs.push(new docx.TextRun({ text: t.text, strike: true, font: { name: "Calibri" }, size: 22 }));
        break;
      case "link":
        runs.push(new docx.TextRun({
          text: t.text || t.href,
          color: "0563C1",
          underline: { type: docx.UnderlineType.SINGLE },
          font: { name: "Calibri" }, size: 22
        }));
        break;
      case "br":
        runs.push(new docx.TextRun({ text: "", break: 1 }));
        break;
      default:
        if (t.text) runs.push(new docx.TextRun({ text: t.text, font: { name: "Calibri" }, size: 22 }));
    }
  }
  if (runs.length === 0) runs.push(new docx.TextRun({ text: " ", font: { name: "Calibri" }, size: 22 }));
  return runs;
}

function alignToDocx(align) {
  if (!align) return docx.AlignmentType.LEFT;
  if (align === "center") return docx.AlignmentType.CENTER;
  if (align === "right") return docx.AlignmentType.RIGHT;
  return docx.AlignmentType.LEFT;
}

function tableCellBorders() {
  return {
    top: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
    bottom: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
    left: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
    right: { style: docx.BorderStyle.SINGLE, size: 1, color: "BFBFBF" },
  };
}

function renderPreview(tables) {
  const totalRows = tables.reduce((s, t) => s + t.rows.length, 0);
  const totalLines = mdContent.split("\\n").length;
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-item"><div class="stat-num">${tables.length}</div><div class="stat-label">识别表格</div></div>
    <div class="stat-item"><div class="stat-num">${totalRows}</div><div class="stat-label">数据行数</div></div>
    <div class="stat-item"><div class="stat-num">${totalLines}</div><div class="stat-label">文档总行</div></div>
  `;
  
  const container = document.getElementById("tabTables");
  if (tables.length === 0) {
    container.innerHTML = \'<div class="empty-state">文档中未检测到 Markdown 表格</div>\';
  } else {
    container.innerHTML = tables.map((t, i) => `
      <div class="table-item">
        <div class="table-item-title">📊 表格 ${i+1} — ${t.header.length} 列 × ${t.rows.length} 行</div>
        <div class="table-preview-wrap">
          <table>
            <thead><tr>${t.header.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>
            <tbody>
              ${t.rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `).join("");
  }
  
  document.getElementById("docPreview").textContent = mdContent;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("tab" + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add("active");
  });
});

btnConvert.addEventListener("click", async () => {
  if (!mdContent) return;
  btnConvert.disabled = true;
  btnConvert.textContent = "⏳ 转换中...";
  
  try {
    await generateDocx();
    const { tables } = parseMarkdown(mdContent);
    renderPreview(tables);
    resultArea.style.display = "block";
    resultArea.scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    alert("转换出错：" + err.message);
    console.error(err);
  }
  
  btnConvert.disabled = false;
  btnConvert.textContent = "🔧 开始转换";
});

document.getElementById("btnDownload").addEventListener("click", () => {
  if (!docBlob) return;
  const url = URL.createObjectURL(docBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "converted_document.docx";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
